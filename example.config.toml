# Gruvbox dark. Copy to your platform config file:
# Linux: ~/.config/velocitty/config.toml
# Windows: %APPDATA%/velocitty/config.toml
# macOS: ~/Library/Application Support/velocitty/config.toml
# XDG_CONFIG_HOME overrides these locations when set.
# On Linux, Omarchy theme colors overlay this palette when a current theme is present.
foreground = "#ebdbb2"
background = "#282828"
cursor = "#ebdbb2"

[normal]
black = "#282828"
red = "#cc241d"
green = "#98971a"
yellow = "#d79921"
blue = "#458588"
magenta = "#b16286"
cyan = "#689d6a"
white = "#a89984"

[bright]
black = "#928374"
red = "#fb4934"
green = "#b8bb26"
yellow = "#fabd2f"
blue = "#83a598"
magenta = "#d3869b"
cyan = "#8ec07c"
white = "#ebdbb2"

[general]
pad = 14
# Legacy refreshrate/hz and whitelist keys are parsed but currently ignored.
# Cadence follows the Hyprland monitor refresh rate, or 60 Hz otherwise.

[font]
# Linux uses fontconfig; Windows/macOS use installed native font families.
# "monospace" defaults to the desktop font, Consolas on Windows, or Menlo on macOS.
family = "monospace"
# Extra installed families, in order, before built-in platform fallbacks.
# fallbacks = ["Symbols Nerd Font Mono"]
fallbacks = []
# Point size. Omit to use Alacritty's size, then 9 pt with an Omarchy theme,
# or 8 pt otherwise.
size = 16
